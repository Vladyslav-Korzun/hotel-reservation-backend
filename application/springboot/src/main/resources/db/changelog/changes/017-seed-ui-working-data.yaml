                (6001, 'Nitra Wellness Hotel', 'Nitra', 'Slovakia', 'Spa Road 14', 5,
                 'Wellness hotel used for admin and catalog testing', 'ACTIVE', true, true, 2, 14)
              on conflict (id) do update
              set name = excluded.name,
                  city = excluded.city,
                  country = excluded.country,
                  address = excluded.address,
                  stars = excluded.stars,
                  description = excluded.description,
                  status = excluded.status,
                  children_allowed = excluded.children_allowed,
                  pets_allowed = excluded.pets_allowed,
                  infant_max_age = excluded.infant_max_age,
                  child_max_age = excluded.child_max_age;

