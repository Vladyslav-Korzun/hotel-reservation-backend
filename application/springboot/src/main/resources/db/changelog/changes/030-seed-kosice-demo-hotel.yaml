                (10042, 1004, 'PARKING',         'Parking (per night)',                'Secure underground parking with 24h access',                     12.00, 'EUR', true, 'DAILY'),
                (10043, 1004, 'WELCOME_PACKAGE', 'Welcome package',                    'Bottle of Tokaj wine, local sweets and fresh fruit basket',       35.00, 'EUR', true, 'ON_ARRIVAL'),
                (10044, 1004, 'WELLNESS_PASS',   'Wellness pass (per night)',          'Unlimited access to sauna, steam room and indoor pool',           25.00, 'EUR', true, 'DAILY'),
                (10045, 1004, 'FLOWERS_IN_ROOM', 'Flowers in room',                    'Fresh seasonal bouquet arranged in room before arrival',          20.00, 'EUR', true, 'ON_ARRIVAL');
