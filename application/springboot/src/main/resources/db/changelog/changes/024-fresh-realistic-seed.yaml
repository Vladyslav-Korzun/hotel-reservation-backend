              -- =========================================================================
              -- Fresh realistic seed for demo: 9 hotels in Slovakia,
              -- 122 rooms, 15 guests, ~30 reservations covering all statuses.
              -- =========================================================================

              -- 1. WIPE existing data in FK order
              delete from reservation_service_items;
              delete from stays;
              delete from reservations;
              delete from hotel_service_offerings;
              delete from staff;
              delete from rooms;
              delete from room_types;
              delete from hotels;
              delete from guests where id <> 10;

              -- 2. HOTELS (9 in Slovakia)
              insert into hotels (id, name, city, country, address, stars, description, status,
                                  children_allowed, pets_allowed, infant_max_age, child_max_age, adult_equivalent_age) values
