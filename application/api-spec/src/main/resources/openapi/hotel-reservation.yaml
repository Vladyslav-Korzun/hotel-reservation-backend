    RoomAmenityCode:
      type: string
      enum:
        - WIFI
        - AIR_CONDITIONING
        - HEATING
        - PRIVATE_BATHROOM
        - BATHTUB
        - SHOWER
        - HAIRDRYER
        - SAFE
        - MINIBAR
        - COFFEE_MACHINE
        - SMART_TV
        - SOUNDPROOFING
        - BALCONY
        - SEA_VIEW
        - CITY_VIEW
        - MOUNTAIN_VIEW
        - WORKSPACE
        - WHEELCHAIR_ACCESSIBLE
    RoomTypeResponse:
      type: object
      required:
        - roomTypeId
        - hotelId
        - name
        - maxAdults
        - maxChildren
        - maxInfants
        - maxTotalGuests
        - petsAllowed
        - maxPets
        - allowedPetTypes
        - basePriceAmount
        - basePriceCurrency
      properties:
        roomTypeId:
          type: integer
          format: int64
        hotelId:
          type: integer
          format: int64
        name:
          type: string
        maxAdults:
          type: integer
        maxChildren:
          type: integer
          description: Maximum number of non-infant children allowed for this room type.
        maxInfants:
          type: integer
          description: Maximum number of infants allowed for this room type. Infants are classified from childrenAges using the hotel's infantMaxAge.
        maxTotalGuests:
          type: integer
          description: Maximum occupancy counted as adults, adult-equivalent minors, and non-infant children. Infants are limited separately by maxInfants.
        petsAllowed:
          type: boolean
        maxPets:
          type: integer
        allowedPetTypes:
          type: array
          items:
            type: string
            enum: [DOG, CAT, OTHER]
        maxPetWeightKg:
          type: number
        petFeeAmount:
          type: number
        petFeeCurrency:
          type: string
        basePriceAmount:
          type: number
        basePriceCurrency:
          type: string
        description:
          type: string
        bedSetup:
          type: string
          nullable: true
          maxLength: 120
          description: Human-readable bed configuration as a single line. Null when not yet configured.
          example: 1 king bed + sofa bed
        roomSizeSqm:
          type: number
          format: float
          nullable: true
          minimum: 1
          maximum: 1000
          description: Room floor area in square metres. Null when unknown.
          example: 28.5
        amenities:
          type: array
          description: Room amenities as stable enum codes. Frontend maps each code to an icon and a localized label.
          items:
            $ref: '#/components/schemas/RoomAmenityCode'
          example: [WIFI, AIR_CONDITIONING, PRIVATE_BATHROOM, SEA_VIEW]
