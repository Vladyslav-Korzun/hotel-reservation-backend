components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HotelResponse:
      type: object
      required:
        - hotelId
        - name
        - city
        - country
        - address
        - stars
        - status
        - childrenAllowed
        - petsAllowed
        - infantMaxAge
        - childMaxAge
        - adultEquivalentAge
      properties:
        hotelId:
          type: integer
          format: int64
        name:
          type: string
        city:
          type: string
        country:
          type: string
        address:
          type: string
        stars:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, UNDER_MAINTENANCE]
        childrenAllowed:
          type: boolean
          description: Whether this hotel accepts children and infants. If false, childrenAges must be empty when searching or creating a reservation.
        petsAllowed:
          type: boolean
        infantMaxAge:
          type: integer
          description: Inclusive maximum age classified as an infant for this hotel. Infants are submitted inside childrenAges.
        childMaxAge:
          type: integer
          description: Inclusive maximum age that counts as a child for this hotel. Older minors from adultEquivalentAge count against adult occupancy instead.
        adultEquivalentAge:
          type: integer
          description: Inclusive age from which a minor submitted in childrenAges counts as an adult for occupancy limits. Must be less than 18.
    HotelServiceOfferingResponse:
      type: object
      required:
        - serviceOfferingId
        - hotelId
        - code
        - name
        - priceAmount
        - priceCurrency
        - active
      properties:
        serviceOfferingId:
          type: integer
          format: int64
        hotelId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: string
        priceAmount:
          type: number
        priceCurrency:
          type: string
        active:
          type: boolean
        availabilityRule:
          type: string
    CreateHotelRequest:
      type: object
      required:
        - hotelId
        - name
        - city
        - country
        - address
        - stars
        - status
        - childrenAllowed
        - petsAllowed
        - infantMaxAge
        - childMaxAge
        - adultEquivalentAge
      properties:
        hotelId:
          type: integer
          format: int64
        name:
          type: string
        city:
          type: string
        country:
          type: string
        address:
          type: string
        stars:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, UNDER_MAINTENANCE]
        childrenAllowed:
          type: boolean
          description: Whether this hotel accepts children and infants. If false, childrenAges must be empty when searching or creating a reservation.
        petsAllowed:
          type: boolean
        infantMaxAge:
          type: integer
          minimum: 0
          description: Inclusive maximum age classified as an infant for this hotel. Infants are submitted inside childrenAges.
        childMaxAge:
          type: integer
          minimum: 0
          description: Inclusive maximum age that counts as a child for this hotel. Older minors from adultEquivalentAge count against adult occupancy instead.
        adultEquivalentAge:
          type: integer
          minimum: 1
          maximum: 17
          description: Inclusive age from which a minor submitted in childrenAges counts as an adult for occupancy limits. Must be greater than infantMaxAge.
    UpdateHotelRequest:
      type: object
      required:
        - name
        - city
        - country
        - address
