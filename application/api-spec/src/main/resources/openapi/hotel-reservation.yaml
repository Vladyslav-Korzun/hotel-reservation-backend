        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, CLEANING, MAINTENANCE, OUT_OF_SERVICE]
    AvailableRoomResponse:
      type: object
      required:
        - hotelId
        - hotelName
        - roomTypeId
        - roomTypeName
        - maxAdults
        - maxChildren
        - maxInfants
        - maxTotalGuests
        - petsAllowed
        - maxPets
        - basePriceAmount
        - basePriceCurrency
        - availableCount
      properties:
        hotelId:
          type: integer
          format: int64
        hotelName:
          type: string
        roomTypeId:
          type: integer
          format: int64
        roomTypeName:
          type: string
        maxAdults:
          type: integer
        maxChildren:
          type: integer
        maxInfants:
          type: integer
        maxTotalGuests:
          type: integer
        petsAllowed:
          type: boolean
        maxPets:
          type: integer
        basePriceAmount:
          type: number
        basePriceCurrency:
          type: string
        availableCount:
          type: integer
        bedSetup:
          type: string
          nullable: true
          maxLength: 120
          description: Human-readable bed configuration as a single line. Null when not yet configured.
          example: 1 king bed + sofa bed
        roomSizeSqm:
          type: number
          format: float
          nullable: true
          minimum: 1
          maximum: 1000
          description: Room floor area in square metres. Null when unknown.
          example: 28.5
        amenities:
          type: array
          description: Room amenities as stable enum codes. Frontend maps each code to an icon and a localized label.
          items:
            $ref: '#/components/schemas/RoomAmenityCode'
          example: [WIFI, AIR_CONDITIONING, PRIVATE_BATHROOM, SEA_VIEW]
    RoomTypeAvailabilityCalendarDayResponse:
      type: object
      required:
        - date
        - availableCount
        - available
      properties:
        date:
          type: string
          format: date
        availableCount:
          type: integer
        available:
          type: boolean
    ErrorResponse:
      type: object
      description: RFC 7807 problem details response returned by the REST layer.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: checkOut must be after checkIn
        instance:
          type: string
          example: /reservations
